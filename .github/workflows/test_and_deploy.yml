name: Tests, Package, and Deployment

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [next]
    tags: ['v*']

env:
  PKG_NAME: pyoncatqt
  MODULE_NAME: pyoncatqt

# cancel previous job if new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Testing Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0

      - name: Install pyoncatqt
        run: |
          pixi run python -m pip install -e .

      - name: Run tests
        run: |
          pixi run xvfb-run --server-args="-screen 0 1920x1080x24" -a \
            python -m pytest --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage reports to Codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: ${{ env.CODECOV_TOKEN != '' && github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Dependency check
        run: pixi run audit-deps

  conda-build:
    name: Build conda package
    runs-on: ubuntu-latest
    permissions:
      contents: read          # for actions/checkout
      security-events: write  # for upload-sarif to upload results
      actions: read           # for upload-sarif to read run status
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.ref }}

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0

      - name: Build conda package
        run: |
          pixi run conda-build

          # Stage the built package into a local channel so the composite
          # actions below can index and install it.
          mkdir -p local-channel/linux-64
          find . -maxdepth 1 -name "${{ env.PKG_NAME }}-*.conda" \
            -exec cp {} local-channel/linux-64/ \;

      # pkg-verify requires a conda env that already has the package
      # installed (and micromamba on PATH); pkg-install sets both up.
      - name: Install built conda package
        id: install
        uses: neutrons/gh-actions/pkg-install@eb7a7c6fcfd0cda1a7b238329afc0afd09a4f4af # v2
        with:
          package-name: ${{ env.PKG_NAME }}
          local-channel: ./local-channel
          extra-channels: oncat

      - name: Verify conda package
        uses: neutrons/gh-actions/pkg-verify@eb7a7c6fcfd0cda1a7b238329afc0afd09a4f4af # v2
        with:
          package-name: ${{ env.PKG_NAME }}
          module-name: ${{ env.MODULE_NAME }}
          conda-env-name: ${{ steps.install.outputs.conda-env }}

      # Audit the dependencies of the conda package we just installed. SARIF
      # results are uploaded to GitHub code scanning by the grype action.
      - name: Scan installed environment with Grype
        uses: neutrons/gh-actions/grype@eb7a7c6fcfd0cda1a7b238329afc0afd09a4f4af # v2
        with:
          path: ${{ steps.install.outputs.conda-install-dir }}

      - name: Upload conda package as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-conda-package
          path: ${{ env.PKG_NAME }}-*.conda

  publish:
    name: Publish
    runs-on: ubuntu-24.04
    needs: [tests, conda-build]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 100
          fetch-tags: true
          ref: ${{ github.ref }}

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0

      - name: Download previous conda package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifact-conda-package

      - name: Get artifact conda package filename
        run: |
          echo "Files downloaded:"
          ls
          # Get the first file
          FILE_NAME=$(ls ./${{ env.PKG_NAME }}-*.conda)
          echo "Conda package file to publish: $FILE_NAME"

      - name: Upload package to anaconda
        shell: bash -l {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
          IS_RC: ${{ contains(github.ref, 'rc') }}
        run: |
          # label is main or rc depending on the tag-name
          CONDA_LABEL="main"
          if [ "${IS_RC}" = "true" ]; then CONDA_LABEL="rc"; fi
          echo pushing ${{ github.ref }} with label $CONDA_LABEL
          pixi run anaconda upload --label $CONDA_LABEL --user neutrons ${{ env.PKG_NAME }}-*.conda
